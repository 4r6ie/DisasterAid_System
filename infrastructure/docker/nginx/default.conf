# Nginx gateway for the DisasterAid Docker stack.
#
# Serves the whole application on one port (default 80, override with
# WEB_PORT in the root .env):
#   /            -> Vite dev server (frontend container, port 5173)
#   /api, /oauth/-> PHP backend (backend container, port 8000)
#
# In production, replace the frontend proxy with `root /var/www/frontend`
# and serve the built assets from frontend/dist instead.

server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 20m;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300s;
    }

    # --- OAuth (Google / Facebook sign-in) ----------------------------------
    # Browser-facing GET routes handled by the backend. Socialite reads and
    # writes the OAuth state in the session, so the session cookie must
    # survive the round trip through the gateway.
    location /oauth/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300s;
    }

    # --- Frontend (Vite dev server) ----------------------------------------
    # WebSocket upgrade is required for Vite's HMR.
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
